name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Pour publier le rapport de tests sur le commit / la pull request
  checks: write

jobs:
  check:
    name: Lint, build et tests unitaires
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types et build
        run: npm run build

      - name: Tests unitaires et fonctionnels
        run: npm test

      - name: Rapport des tests unitaires
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: Rapport — tests unitaires et fonctionnels
          path: frontend/test-reports/unit-junit.xml
          reporter: java-junit
          use-actions-summary: 'true'
          fail-on-empty: 'false'

  e2e:
    name: Tests end-to-end
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests end-to-end (bureau et mobile)
        run: npm run test:e2e

      - name: Rapport des tests end-to-end
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: Rapport — tests end-to-end
          path: frontend/test-reports/e2e-junit.xml
          reporter: java-junit
          use-actions-summary: 'true'
          fail-on-empty: 'false'

      - name: Rapport Playwright détaillé (captures, traces)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: frontend/playwright-report/
          retention-days: 14

  deploy:
    name: Déploiement Infomaniak
    needs: e2e
    # Seulement après une fusion sur main, et une fois l'hébergement configuré
    # (variable INFOMANIAK_HOST définie dans Settings → Secrets and variables → Actions)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.INFOMANIAK_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build de production
        run: npm run build

      - name: Configurer la clé SSH
        env:
          SSH_KEY: ${{ secrets.INFOMANIAK_SSH_KEY }}
          HOST: ${{ vars.INFOMANIAK_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Envoyer le site
        env:
          HOST: ${{ vars.INFOMANIAK_HOST }}
          USER: ${{ vars.INFOMANIAK_USER }}
          TARGET: ${{ vars.INFOMANIAK_PATH }}
        # --delete retire du serveur les anciens fichiers du build précédent :
        # INFOMANIAK_PATH doit être le dossier du site uniquement
        run: rsync -az --delete dist/ "$USER@$HOST:$TARGET/"
