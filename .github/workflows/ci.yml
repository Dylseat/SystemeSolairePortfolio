name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, build et tests unitaires
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types et build
        run: npm run build

      - name: Tests unitaires et fonctionnels
        run: npm test

      # Résumé en français dans l'onglet « Summary » du run
      - name: Rapport des tests unitaires
        if: ${{ !cancelled() }}
        run: node scripts/test-summary.mjs "Tests unitaires et fonctionnels" test-reports/unit-junit.xml >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Tests end-to-end
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests end-to-end (bureau et mobile)
        run: npm run test:e2e

      - name: Rapport des tests end-to-end
        if: ${{ !cancelled() }}
        run: node scripts/test-summary.mjs "Tests end-to-end (bureau et mobile)" test-reports/e2e-junit.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Rapport Playwright détaillé (captures, traces)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: frontend/playwright-report/
          retention-days: 14

  deploy:
    name: Déploiement Infomaniak
    needs: e2e
    # Seulement après une fusion sur main, et une fois l'hébergement configuré
    # (variable INFOMANIAK_HOST définie dans Settings → Secrets and variables → Actions)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.INFOMANIAK_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build de production
        run: npm run build

      # Hébergement Starter : FTP non chiffré uniquement (pas de FTPS ni de SSH).
      # Compte FTP dédié au déploiement ; passer à SFTP / SSH avec l'Hébergement Web
      - name: Envoyer le site (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.INFOMANIAK_HOST }}
          username: ${{ vars.INFOMANIAK_USER }}
          password: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
          protocol: ftp
          local-dir: frontend/dist/
          # Doit se terminer par « / ». Les fichiers retirés du build sont supprimés
          # du serveur (suivi dans .ftp-deploy-sync-state.json)
          server-dir: ${{ vars.INFOMANIAK_PATH }}
