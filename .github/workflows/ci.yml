name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Pour publier le rapport de tests sur le commit / la pull request
  checks: write

jobs:
  check:
    name: Lint, build et tests unitaires
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types et build
        run: npm run build

      - name: Tests unitaires et fonctionnels
        run: npm test

      - name: Rapport des tests unitaires
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: Rapport — tests unitaires et fonctionnels
          path: frontend/test-reports/unit-junit.xml
          reporter: java-junit
          use-actions-summary: 'true'
          fail-on-empty: 'false'

  e2e:
    name: Tests end-to-end
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests end-to-end (bureau et mobile)
        run: npm run test:e2e

      - name: Rapport des tests end-to-end
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: Rapport — tests end-to-end
          path: frontend/test-reports/e2e-junit.xml
          reporter: java-junit
          use-actions-summary: 'true'
          fail-on-empty: 'false'

      - name: Rapport Playwright détaillé (captures, traces)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: frontend/playwright-report/
          retention-days: 14
